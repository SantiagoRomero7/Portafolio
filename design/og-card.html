<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>OG card — Santiago Romero</title>

    <!--
      Fuente de public/og.png (1200x630), la imagen que se ve al compartir el
      enlace. Vive aquí, fuera de public/, para que no se publique: es la
      plantilla, no un recurso del sitio.

      Se rasteriza con Chrome en modo headless; ver design/README.md.

      Usa los mismos tokens que src/index.css, así que es una continuación de la
      portada y no una pieza aparte: placa #E5E7EB, carbón #000, Instrument Sans
      peso 500 en caja baja con tracking negativo, etiquetas de 14px en versales
      con tracking positivo, y la lima #E2FF70 —el único cromático— detrás de la
      palabra clave y siempre con la letra en negro.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --canvas: #e5e7eb;
        --ink: #000000;
        --smoke: #6e6e6e;
        --lime: #e2ff70;
        --line: rgba(0, 0, 0, 0.14);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        background: var(--canvas);
        color: var(--ink);
        font-family: 'Instrument Sans', Inter, system-ui, sans-serif;
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
      }

      /* Las etiquetas son el único sitio con versales y tracking positivo */
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 32px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
        line-height: 1.3;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--smoke);
      }
      .meta .name {
        color: var(--ink);
      }

      /* El titular es la imagen: mixta, peso 500 y tracking muy cerrado */
      h1 {
        font-size: 100px;
        line-height: 0.92;
        letter-spacing: -0.048em;
        font-weight: 500;
      }

      /* El color va DETRÁS de la letra, nunca en ella, y siempre con negro */
      .hl {
        background: var(--lime);
        color: #000;
        padding-inline: 0.06em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }

      .foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 32px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }

      .figures {
        display: flex;
        gap: 40px;
        font-size: 17px;
        letter-spacing: -0.014em;
        color: var(--smoke);
      }
      .figures b {
        font-weight: 500;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      .url {
        font-size: 15px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--smoke);
      }
    </style>
  </head>

  <body>
    <div class="meta">
      <span class="name">Santiago Romero</span>
      <span>Desarrollador de Software Full Stack</span>
      <span>Bucaramanga, CO</span>
    </div>

    <!--
      Los cortes de línea van a mano, y el motivo es el bloque de lima: el fondo
      de un elemento en línea ocupa toda la caja de la fuente, así que con el
      interlineado cerrado del sistema invade la línea de arriba y le corta los
      rasgos descendentes. Dejando "funciona en" —que no tiene ninguno— encima
      de "producción", el bloque cae limpio sin tener que aflojar el
      interlineado. En la web el texto fluye y no se puede fijar así; aquí es
      una pieza fija y sí se puede.
    -->
    <h1>Desarrollo software que<br />funciona en<br /><span class="hl">producción</span></h1>

    <div class="foot">
      <div class="figures">
        <span><b>25</b> automatizaciones</span>
        <span><b>07</b> proyectos</span>
        <span><b>35</b> tecnologías</span>
      </div>
      <span class="url">srmdev.vercel.app</span>
    </div>
  </body>
</html>
